version: "3"

tasks:
  reinstall-arakawa:
    cmd: uv sync --reinstall-package arakawa
  build-notebooks:
    cmd: ./nbbuild.sh
  clear-notebooks:
    cmd: find . -name "*.ipynb" | xargs uv run nbstripout
  serve:
    cmd: zensical serve
    deps:
      - reinstall-arakawa
      - build-notebooks
  build:
    cmd: zensical build --strict
    deps:
      - reinstall-arakawa
      - build-notebooks
