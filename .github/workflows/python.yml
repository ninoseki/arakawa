name: Python CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/python.yml"
      - "python-client/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/python.yml"
      - "python-client/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", 3.11, 3.12, 3.13]
        pandas:
          - { spec: ">2.2,<3.0", key: "2.x" }
          - { spec: ">=3.0,<4.0", key: "3.x" }
        exclude:
          - python-version: "3.10"
            pandas: { spec: ">=3.0,<4.0", key: "3.x" }
    defaults:
      run:
        working-directory: ./python-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.python-version }}-${{ matrix.pandas.key }}-${{ hashFiles('uv.lock') }}
      - run: |
          uv sync --frozen --all-extras
          uv pip install "pandas${{ matrix.pandas.spec }}"
      - run: uv run pytest
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-3.13-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen --all-extras
      - run: uv run uv-sort --check
      - run: uv run ruff check --output-format github src/
      - run: uv run ruff format --check src/
